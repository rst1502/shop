# =============================================================================
# Nginx Configuration — srv1341707.hstgr.cloud
# =============================================================================
# Traffic routing on port 443 (only exposed port):
#   /api/*      → API service       (localhost:9090)
#   /admin/*    → Admin frontend    (localhost:4200)
#   /*          → Storefront        (localhost:4201)
#   DB access   → PostgreSQL stream (localhost:5432) via SNI on port 443
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# =============================================================================
# STREAM BLOCK — TCP-level routing (SSL passthrough + DB proxy)
# Uses SNI (Server Name Indication) to split HTTPS vs DB traffic on port 443
# =============================================================================
stream {

    # --- Upstream: HTTPS traffic handed off to the http block on 8443 ---
    upstream https_backend {
        server 127.0.0.1:8443;
    }

    # --- Upstream: PostgreSQL database ---
    upstream postgres_backend {
        server 127.0.0.1:5432;
    }

    # Map SNI hostname to the correct backend
    # Clients connecting to the DB should use the SNI name: db.srv1341707.hstgr.cloud
    map $ssl_preread_server_name $upstream_backend {
        db.srv1341707.hstgr.cloud    postgres_backend;
        default                       https_backend;
    }

    server {
        listen 443;               # The ONLY exposed port
        ssl_preread on;           # Read SNI without terminating TLS here

        proxy_pass $upstream_backend;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_timeout         60s;
    }
}

# =============================================================================
# HTTP BLOCK — Application-level routing (TLS terminated here at port 8443)
# =============================================================================
http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Upstreams ---

    upstream api_service {
        server 127.0.0.1:9090;
        keepalive 32;
    }

    upstream storefront {
        server 127.0.0.1:4201;
        keepalive 16;
    }

    upstream admin_panel {
        server 127.0.0.1:4200;
        keepalive 16;
    }

    # --- Redirect HTTP → HTTPS ---
    server {
        listen 80;
        server_name srv1341707.hstgr.cloud;

        return 301 https://$host$request_uri;
    }

    # --- Main HTTPS server (receives traffic from stream block above) ---
    server {
        listen 8443 ssl;
        server_name srv1341707.hstgr.cloud;

        # --- TLS ---
        ssl_certificate     /etc/nginx/ssl/srv1341707.hstgr.cloud.crt;
        ssl_certificate_key /etc/nginx/ssl/srv1341707.hstgr.cloud.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Security headers ---
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # -----------------------------------------------------------------------
        # /api/* → API Service (port 9090)
        # -----------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://api_service;   # trailing slash strips /api prefix
                                                     # Remove the trailing slash below if
                                                     # your service expects /api/ in the path:
                                                     # proxy_pass http://api_service/api/;

            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              srv1341707.hstgr.cloud;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  90s;
            proxy_send_timeout  90s;

            # CORS (adjust origins as needed)
            add_header Access-Control-Allow-Origin  "https://srv1341707.hstgr.cloud" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # -----------------------------------------------------------------------
        # /admin/* → Admin Frontend (port 3001)
        # -----------------------------------------------------------------------
        location /admin/ {
            proxy_pass         http://admin_panel/;  # trailing slash rewrites path

            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";   # supports HMR / WS in dev
            proxy_set_header   Host              srv1341707.hstgr.cloud;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 90s;

            # Restrict admin to specific IPs (recommended — uncomment & edit):
            # allow 203.0.113.0/24;
            # deny  all;
        }

        # -----------------------------------------------------------------------
        # /* → Storefront (port 3000) — catch-all
        # -----------------------------------------------------------------------
        location / {
            proxy_pass         http://storefront;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              srv1341707.hstgr.cloud;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout 90s;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                proxy_pass http://storefront;
                expires    30d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # --- Custom error pages ---
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
